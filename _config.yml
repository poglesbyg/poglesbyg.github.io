title: Paul Greenwood
tagline: Data scientist
description: Data scientist. I measure whether results survive a second check, and write up what I find when they don't.
url: "https://poglesbyg.github.io"
baseurl: ""
lang: en_US

# Read by jekyll-seo-tag for the <head> meta, Open Graph, and JSON-LD.
author:
  name: Paul Greenwood
  url: https://poglesbyg.github.io
social:
  name: Paul Greenwood
  links:
    - https://github.com/poglesbyg
    - https://www.linkedin.com/in/poglesbyg/
# The share image is a square headshot, so ask for the small card. The large
# card crops it into a banner that buries the title.
twitter:
  card: summary

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

markdown: kramdown

defaults:
  - scope:
      path: ""
    values:
      layout: default
      image: /assets/images/paul-greenwood-headshot.jpeg
  - scope:
      path: "_posts"
      type: posts
    values:
      layout: post
      permalink: /blog/:year/:month/:day/:title/

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - CLAUDE.md
  - TODOS.md
  - vendor
  - node_modules
