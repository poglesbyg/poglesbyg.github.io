<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    {% feed_meta %}
    <script>
        // Apply a saved theme before first paint. With nothing saved, CSS follows
        // prefers-color-scheme on its own, so no class is needed.
        try { var t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.classList.add(t); } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
        <a class="site-name" href="/">Paul Greenwood</a>
        <nav aria-label="Main">
            <a href="/projects"{% if page.url contains '/projects' %} aria-current="page"{% endif %}>Projects</a>
            <a href="/blog"{% if page.url contains '/blog' %} aria-current="page"{% endif %}>Writing</a>
            <a href="/contact"{% if page.url contains '/contact' %} aria-current="page"{% endif %}>Contact</a>
        </nav>
    </header>

    <main id="main">
        {{ content }}
    </main>

    <footer class="site-footer">
        <span>&copy; {{ site.time | date: '%Y' }} Paul Greenwood</span>
        <a href="https://github.com/poglesbyg">GitHub</a>
        <a href="https://www.linkedin.com/in/poglesbyg/">LinkedIn</a>
        <a href="mailto:pogrant@alumni.unc.edu">Email</a>
        <a href="/feed.xml">RSS</a>
        <button class="theme-toggle" type="button" hidden>Theme</button>
    </footer>

    <script data-goatcounter="https://paulg.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
