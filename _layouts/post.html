---
layout: default
---

<article>
    <header class="page-header">
        <h1>{{ page.title }}</h1>
        <p class="meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time></p>
    </header>

    <div class="prose">
        {{ content }}
    </div>

    {% if page.previous.url or page.next.url %}
    <nav class="post-nav" aria-label="More writing">
        {% if page.previous.url %}<a href="{{ page.previous.url | relative_url }}">&larr; {{ page.previous.title }}</a>{% endif %}
        {% if page.next.url %}<a href="{{ page.next.url | relative_url }}">{{ page.next.title }} &rarr;</a>{% endif %}
    </nav>
    {% endif %}
</article>
